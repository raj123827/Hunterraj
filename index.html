<!DOCTYPE html>
<html>
<head>
    <title>Rudra Gallery</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        h1 {
            padding: 25px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: #222;
            padding: 15px;
            border-radius: 15px;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Rudra Photo Gallery 📸</h1>

    <div class="gallery">

        <div class="card">
            <img src="photo.png" onclick="showPhoto(this.src)">
            <h2>Photo 1</h2>
        </div>

        <div class="card">
            <img src="photo2.png" onclick="showPhoto(this.src)">
            <h2>Photo 2</h2>
        </div>

        <div class="card">
            <img src="photo3.png" onclick="showPhoto(this.src)">
            <h2>Photo 3</h2>
        </div>

    </div>

    <script>
        function showPhoto(photo) {
            window.open(photo, "_blank");
        }
    </script>

</body>
</html>
